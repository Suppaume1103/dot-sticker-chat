<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" width="64" height="64" shape-rendering="crispEdges">
  <!-- 吹き出しの輪郭：ink色 -->
  <rect x="0" y="0" width="8" height="1" fill="#1a1a1a"/>
  <rect x="0" y="1" width="1" height="4" fill="#1a1a1a"/>
  <rect x="7" y="1" width="1" height="4" fill="#1a1a1a"/>
  <rect x="0" y="5" width="8" height="1" fill="#1a1a1a"/>

  <!-- 吹き出しの中身：アクセントカラー(赤) -->
  <rect x="1" y="1" width="6" height="4" fill="#e0483d"/>

  <!-- 尻尾 -->
  <rect x="1" y="6" width="1" height="1" fill="#1a1a1a"/>
  <rect x="0" y="7" width="1" height="1" fill="#1a1a1a"/>

  <!-- 中の「…」：白いドット3つ -->
  <rect x="1" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="3" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="5" y="2" width="1" height="1" fill="#ffffff"/>
</svg>
